name: post-sale-agent

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Senhas sem valor padrão: o Compose recusa subir se faltarem no .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-post_sale}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina no .env}
      RETRIEVAL_DB_PASSWORD: ${RETRIEVAL_DB_PASSWORD:?defina no .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?defina no .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./services/orders
    environment:
      PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-post_sale}
      DATABASE_USER: orders_service
      DATABASE_PASSWORD: ${ORDERS_DB_PASSWORD:?defina no .env}
      ORDERS_API_KEY: ${ORDERS_API_KEY:?defina no .env}
      ORDERS_SIMULATION_ENABLED: "true"
      ORDERS_SIMULATED_DELAY_MS: 5000
      LOG_LEVEL: info
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build: ./services/api
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-post_sale}
      DATABASE_USER: app_service
      DATABASE_PASSWORD: ${APP_DB_PASSWORD:?defina no .env}
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT_MS: 60000
      # O Ollama roda no Mac, fora do Compose; host.docker.internal aponta para o Mac
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Bedrock: credenciais do perfil da AWS CLI, montado como somente leitura (só em dev)
      AWS_REGION: us-east-1
      AWS_PROFILE: ${AWS_PROFILE:-post-sale-agent}
      # O agente consulta pedidos e pagamentos no serviço orders, pela rede interna do Compose
      ORDERS_BASE_URL: http://orders:3002
      ORDERS_API_KEY: ${ORDERS_API_KEY:?defina no .env}
      ORDERS_TIMEOUT_MS: 3000
      AGENT_MAX_STEPS: 5
      LOG_LEVEL: info
    volumes:
      - ~/.aws:/home/node/.aws:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
