[project]
name = "retrieval"
version = "0.1.0"
description = "Semantic search over the store policies (RAG) for post-sale-agent"
readme = "README.md"
authors = [
    { name = "Carolina Valdrighi", email = "valdrighdev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "langchain-aws>=1.9.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-json-logger>=4.2.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
retrieval = "retrieval:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: precisa do Ollama rodando com o modelo bge-m3 (rode com RUN_OLLAMA_TESTS=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
